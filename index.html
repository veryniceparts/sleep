<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sleep Apnea Monitor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>Sleep Monitor</h1>
      <button id="btnMenu" class="icon-btn" aria-label="Settings">⋮</button>
    </header>

    <!-- live monitor: level, graph and Start/Stop in one card -->
    <section class="monitor-card" id="monitorCard">
      <div class="mc-top">
        <div class="level-readout"><span id="levelNow">--</span><small>dB</small></div>
        <div class="mc-state">
          <span id="stState">Starting microphone…</span>
          <span id="stInfo" class="muted"></span>
        </div>
      </div>
      <div class="meter">
        <div id="meterBar" class="meter-bar"></div>
        <div id="meterFloor" class="meter-mark floor" title="Breath level"></div>
        <div id="meterThreshold" class="meter-mark threshold" title="Recording threshold"></div>
      </div>
      <canvas id="liveChart"></canvas>
      <label class="thr-row">
        <span>Threshold <b id="thresholdVal">60</b> dB</span>
        <input id="thresholdQuick" type="range" min="20" max="100" step="1" value="60">
      </label>
      <button id="btnToggle" class="toggle">Start</button>
    </section>

    <!-- past nights: 4x2 grid per week -->
    <section class="nights">
      <div class="week-nav">
        <button id="weekPrev" class="icon-btn" aria-label="Previous week">‹</button>
        <span id="weekLabel"></span>
        <button id="weekNext" class="icon-btn" aria-label="Next week">›</button>
      </div>
      <div id="weekGrid" class="week-grid"></div>
    </section>
  </div>

  <!-- settings (⋮) -->
  <div id="menuSheet" class="sheet" hidden>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2>Settings</h2>
        <button class="icon-btn sheet-close" aria-label="Close">✕</button>
      </div>
      <div class="sheet-body">
        <label class="field check"><input type="checkbox" id="recordAll">
          <span><b>Record the whole night</b> (about 15 MB per hour) to replay any moment</span></label>
        <div id="recordAllInfo" class="muted"></div>
        <div class="actions">
          <button id="btnCalibrate">Auto-set threshold</button>
          <button id="btnNight">Night mode</button>
          <button id="btnBattery" hidden>Allow background running</button>
        </div>

        <h3>Recording</h3>
        <label class="field row-field"><span>Threshold (dB)</span>
          <input type="number" id="setThreshold" min="20" max="100" step="1"></label>
        <label class="field row-field"><span>Pre-roll (s)</span>
          <input type="number" id="setPreRoll" min="0" max="15" step="1"></label>
        <label class="field row-field"><span>Stop after quiet for (s)</span>
          <input type="number" id="setPostRoll" min="1" max="30" step="1"></label>
        <label class="field row-field"><span>Max clip length (s)</span>
          <input type="number" id="setMaxClip" min="5" max="300" step="5"></label>

        <h3>Breathing pauses</h3>
        <label class="field row-field"><span>Minimum pause (s)</span>
          <input type="number" id="setApneaGap" min="5" max="60" step="1"></label>
        <label class="field row-field"><span>Ignore pauses longer than (s)</span>
          <input type="number" id="setApneaMax" min="20" max="300" step="5"></label>
        <label class="field row-field"><span>Breath sensitivity (dB above floor)</span>
          <input type="number" id="setBreathMargin" min="2" max="30" step="1"></label>
        <label class="field row-field"><span>Breaths needed before a pause</span>
          <input type="number" id="setMinBreaths" min="1" max="20" step="1"></label>
        <label class="field check"><input type="checkbox" id="setClipPauses">
          <span>Save a clip when breathing restarts after a pause</span></label>

        <div class="actions"><button id="btnResetSettings">Reset to defaults</button></div>
        <p class="muted small" id="storageInfo"></p>
        <p class="muted small">Levels are relative (0 = silence, ~100 = maximum) and differ between phones.</p>
        <p class="disclaimer">⚠️ Not a medical device and can't diagnose sleep apnea. A sleep study is the only reliable diagnosis.</p>
      </div>
    </div>
  </div>

  <!-- one night, opened from the grid -->
  <div id="nightSheet" class="sheet full" hidden>
    <div class="sheet-panel">
      <div class="sheet-head">
        <button class="icon-btn sheet-close" aria-label="Back">‹</button>
        <h2 id="nightTitle"></h2>
        <button id="nightMenu" class="icon-btn" aria-label="Actions">⋮</button>
      </div>
      <div id="nightPick" class="night-pick"></div>
      <div class="sheet-body" id="nightBody"></div>
    </div>
  </div>

  <div id="nightOverlay" hidden>
    <div class="night-text">
      <div id="nightClock">--:--</div>
      <div id="nightInfo"></div>
      <div class="night-tip">Tap twice to exit</div>
    </div>
  </div>

  <template id="sessionTpl">
    <div class="session">
      <div class="s-meta muted"></div>
      <div class="chart-tools">
        <button class="z-out" aria-label="Zoom out">−</button>
        <button class="z-in" aria-label="Zoom in">+</button>
        <button class="z-all">All</button>
        <span class="z-label muted"></span>
      </div>
      <div class="chart-box">
        <canvas class="s-chart"></canvas>
        <div class="s-tip" hidden></div>
      </div>
      <div class="legend muted"><span class="lg lvl"></span>level <span class="lg thr"></span>threshold
        <span class="lg evt"></span>pause <span class="lg clp"></span>clip <span class="lg full"></span>full rec.</div>

      <div class="player">
        <button class="p-prev" aria-label="Previous">⏮</button>
        <button class="p-play primary" aria-label="Play">▶</button>
        <button class="p-next" aria-label="Next">⏭</button>
        <div class="p-info">
          <div class="p-title">Tap the graph to play</div>
          <div class="p-bar"><input type="range" class="p-seek" min="0" max="1000" value="0">
            <span class="p-time muted">0:00</span></div>
        </div>
      </div>

      <div class="s-lists">
        <section class="s-panel">
          <div class="s-panel-head">Breathing pauses <span class="n-ev"></span></div>
          <div class="s-list-body s-events"></div>
        </section>
        <section class="s-panel">
          <div class="s-panel-head">Clips <span class="n-cl"></span></div>
          <div class="s-list-body s-clips"></div>
        </section>
      </div>

      <div class="s-actions" hidden>
        <button class="btn-csv">Export CSV</button>
        <button class="btn-dlall">Download clips</button>
        <button class="btn-dlfull" hidden>Download full recording</button>
        <button class="btn-delfull danger" hidden>Delete full recording</button>
        <button class="btn-del danger">Delete night</button>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
